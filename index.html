<html lang="en"><head><meta charset="utf-8">

<title>Job Fair PMI Guide</title><style>
:root{--bg:#F1F2F4;--surface:#FFFFFF;--fg:#111820;--muted:#59636F;--line:#D5DAE0;--bad:#B3261E;
  --f:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#0E1216;--surface:#161B21;--fg:#E8ECF0;--muted:#97A1AC;--line:#2A323B;--bad:#FF8A80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f);
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.box{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:1.25rem;line-height:1.25}
p{margin:0;color:var(--muted);font-size:.9rem}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=password]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:10px 12px;width:100%}
.check{display:flex;align-items:center;gap:8px;color:var(--fg)}
.check input{accent-color:var(--fg);width:18px;height:18px;margin:0}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:5px;padding:11px 14px;cursor:pointer;text-align:center;text-decoration:none;display:block}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);min-height:1.2em}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
</style></head>

async function derive(u,p){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(u.trim().toLowerCase()+"\n"+p),"PBKDF2",false,["deriveKey"]);

}

  return btoa(String.fromCharCode(...new Uint8Array(bits)));
}
